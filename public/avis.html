<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis Clients - Bobo Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="cart-page-header">
        <a href="index.html" class="back-button" aria-label="Retour à l'accueil"><i class="fas fa-arrow-left"></i></a>
        <h1 class="cart-page-title">Avis des Clients</h1>
    </header>

    <main class="avis-main-container page-fade-in">
        <h2 class="avis-section-title"><i class="fas fa-comments"></i> Ce que disent nos clients</h2>

        <ul class="avis-list" id="avis-list">
            <!-- Skeletons affichés pendant le chargement -->
            <li class="avis-skeleton">
                <div class="skeleton-line w-40"></div>
                <div class="skeleton-line w-90"></div>
                <div class="skeleton-line w-70"></div>
            </li>
            <li class="avis-skeleton">
                <div class="skeleton-line w-40"></div>
                <div class="skeleton-line w-90"></div>
                <div class="skeleton-line w-70"></div>
            </li>
        </ul>

        <form class="avis-form" id="avis-form" novalidate>
            <h3><i class="fas fa-pen"></i> Laissez votre avis</h3>

            <div class="avis-field">
                <label for="nom-input">Votre nom</label>
                <input type="text" id="nom-input" placeholder="Ex : Awa K." maxlength="50" required>
            </div>

            <div class="avis-field">
                <label>Votre note</label>
                <div class="star-rating" id="star-rating">
                    <input type="radio" id="star5" name="note" value="5"><label for="star5" title="5 étoiles"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star4" name="note" value="4"><label for="star4" title="4 étoiles"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star3" name="note" value="3" checked><label for="star3" title="3 étoiles"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star2" name="note" value="2"><label for="star2" title="2 étoiles"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star1" name="note" value="1"><label for="star1" title="1 étoile"><i class="fas fa-star"></i></label>
                </div>
            </div>

            <div class="avis-field">
                <label for="avis-input">Votre avis</label>
                <textarea id="avis-input" placeholder="Dites-nous ce que vous avez pensé de votre commande..." maxlength="400" required></textarea>
                <div class="char-counter"><span id="char-count">0</span>/400</div>
            </div>

            <button type="submit" class="avis-submit-btn" id="avis-submit-btn">
                <i class="fas fa-paper-plane"></i>
                <span>Envoyer mon avis</span>
            </button>
        </form>
    </main>

    <nav class="bottom-menu">
        <a href="index.html" class="menu-item">
            <i class="fas fa-home"></i>
            <span>Accueil</span>
        </a>
        <a href="panier.html" class="menu-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Panier</span>
            <span class="cart-badge" id="cart-item-count">0</span>
        </a>
        <a href="avis.html" class="menu-item active">
            <i class="fas fa-star"></i>
            <span>Avis</span>
        </a>
        <a href="index.html#promo" class="menu-item promo-menu-item">
            <span class="promo-pill">
                <i class="fas fa-fire"></i>
                <span>Promo du jour</span>
            </span>
        </a>
    </nav>

    <script src="common.js"></script>
    <script>
        const avisForm = document.getElementById('avis-form');
        const nomInput = document.getElementById('nom-input');
        const avisInput = document.getElementById('avis-input');
        const charCount = document.getElementById('char-count');
        const avisList = document.getElementById('avis-list');
        const submitBtn = document.getElementById('avis-submit-btn');

        // --- Compteur de caractères en temps réel ---
        avisInput.addEventListener('input', () => {
            charCount.textContent = avisInput.value.length;
        });

        // Note : showToast() est fournie par common.js

        function renderStars(note) {
            const rounded = Math.round(Number(note)) || 0;
            let html = '';
            for (let i = 1; i <= 5; i++) {
                html += `<i class="fas fa-star ${i <= rounded ? '' : 'star-off'}"></i>`;
            }
            return html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function chargerAvis() {
            try {
                const res = await fetch("/get-avis");
                const avis = await res.json();

                avisList.innerHTML = "";

                if (!avis || avis.length === 0) {
                    avisList.innerHTML = `
                        <div class="no-avis-message">
                            <i class="fas fa-comments"></i>
                            <p>Aucun avis n'a encore été publié.</p>
                            <p>Soyez le premier à laisser le vôtre !</p>
                        </div>`;
                    return;
                }

                avis.forEach((a, index) => {
                    const li = document.createElement("li");
                    li.classList.add("avis-item");
                    li.style.animationDelay = `${Math.min(index, 8) * 0.05}s`;
                    li.innerHTML = `
                        <div class="avis-item-header">
                            <span class="avis-item-name">${escapeHtml(a.nom)}</span>
                            <span class="avis-item-stars">${renderStars(a.note)}</span>
                        </div>
                        <p class="avis-item-text">${escapeHtml(a.avis)}</p>
                        <span class="avis-date">${new Date(a.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                    `;
                    avisList.appendChild(li);
                });
            } catch (error) {
                console.error("Erreur lors du chargement des avis :", error);
                avisList.innerHTML = `
                    <div class="no-avis-message">
                        <i class="fas fa-triangle-exclamation"></i>
                        <p>Impossible de charger les avis pour le moment.</p>
                    </div>`;
            }
        }

        if (avisForm) {
            avisForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const noteChecked = avisForm.querySelector('input[name="note"]:checked');

                if (!nomInput.value.trim() || !avisInput.value.trim() || !noteChecked) {
                    showToast("Merci de remplir tous les champs.", "error");
                    return;
                }

                const avisData = {
                    nom: nomInput.value.trim(),
                    avis: avisInput.value.trim(),
                    note: noteChecked.value
                };

                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span class="spinner"></span><span>Envoi en cours...</span>`;

                try {
                    const res = await fetch("/submit-avis", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(avisData)
                    });

                    const data = await res.json();
                    showToast(data.message || "Merci pour votre avis !", "success");

                    avisForm.reset();
                    charCount.textContent = "0";
                    document.getElementById('star3').checked = true;
                    chargerAvis();
                } catch (error) {
                    console.error("Erreur lors de l'envoi de l'avis :", error);
                    showToast("Une erreur est survenue. Réessayez.", "error");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fas fa-paper-plane"></i><span>Envoyer mon avis</span>`;
                }
            });
        }

        chargerAvis();
    </script>
</body>
</html>
