<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Bobo Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="logo-container">
        <img src="image/bobo.jpg" alt="BoboTech - Faso Yaar" class="main-logo">
    </div>

    <header>
        <div class="header-content-wrapper">
            <div class="search-bar-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Rechercher sur la boutique..." class="search-input">
            </div>

            <nav class="categories-nav">
                <div class="category-scroll-wrapper">
                    <div class="category-scroll">
                        <a href="#" class="category-item active" data-category="all"><i class="fas fa-border-all"></i>Toutes</a>
                        <a href="#" class="category-item promo-item" data-category="promo">
                            <i class="fas fa-tags promo-icon"></i>
                            Promos
                        </a>
                        <a href="#" class="category-item" data-category="telephones_tablettes"><i class="fas fa-mobile-screen-button"></i>Téléphones & Tablettes</a>
                        <a href="#" class="category-item" data-category="ecouteurs_casques"><i class="fas fa-headphones"></i>Écouteurs & Casques</a>
                        <a href="#" class="category-item" data-category="power_banks_energie"><i class="fas fa-battery-full"></i>Power Banks & Énergie</a>
                        <a href="#" class="category-item" data-category="montres_boomeur"><i class="fas fa-clock"></i>Montres Connectées & boomeur</a>
                        <a href="#" class="category-item" data-category="equipement_solaire"><i class="fas fa-solar-panel"></i>Équipements solaire</a>
                        <a href="#" class="category-item" data-category="telephones_touches"><i class="fas fa-phone"></i>Téléphone à touches</a>
                        <a href="#" class="category-item" data-category="accessoires_divers"><i class="fas fa-plug"></i>Accessoires Tech Divers</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="product-display page-fade-in">
        <section class="products">
            <div class="products-toolbar">
                <span id="results-count" class="results-count"></span>
            </div>
            <div class="products-grid" id="product-list"></div>
        </section>
    </main>

    <button class="scroll-top-btn" id="scroll-top-btn" aria-label="Remonter en haut">
        <i class="fas fa-arrow-up"></i>
    </button>

    <nav class="bottom-menu">
        <a href="index.html" class="menu-item active">
            <i class="fas fa-home"></i>
            <span>Accueil</span>
        </a>
        <a href="panier.html" class="menu-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Panier</span>
            <span class="cart-badge" id="cart-item-count">0</span>
        </a>
        <a href="avis.html" class="menu-item">
            <i class="fas fa-star"></i>
            <span>Avis</span>
        </a>
    </nav>

    <script src="common.js"></script>
    <script src="script.js"></script>
</body>
</html>
